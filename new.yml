AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation Template to create an EC2 instance without parameters.

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      # Replace with a valid AMI ID for your specific Region (e.g., Amazon Linux 2023)
      ImageId: ami-0236922087fa98b6e
      InstanceType: t2.micro
      Tags:
        - Key: Name
          Value: MyHardcodedInstance
