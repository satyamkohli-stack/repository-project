AWSTemplateFormatVersion: '2010-09-09'
Resources:
  SimpleRole:
    Type: 'AWS::IAM::Role'
    Properties:
      # Trust Policy: Allows Lambda to use this role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ://amazonaws.com
            Action: sts:AssumeRole
      
      # Inline Policy: Minimum required fields
      Policies:
        - PolicyName: SimpleInlinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: '*'
